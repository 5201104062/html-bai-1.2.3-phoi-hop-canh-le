<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heading</title>
</head>
<body>
    <!--
        Bài 1.2.3. Phối hợp các loại canh lề
        Phối hợp các thẻ Hn (h1 đến h6) với thuộc tính align:
          align="center" : canh giữa
          align="right"  : canh phải
          align="left"   : canh trái (mặc định, không ghi cũng được)
    -->
    <h1 align="center">This is a heading h1</h1>
    <h2 align="left">This is a heading h2</h2>
    <h3 align="right">This is a heading h3</h3>
    <h4 align="center">This is a heading h4</h4>
    <h5>This is a heading h5</h5>
    <h6 align="right">This is a heading h6</h6>
</body>
</html>
